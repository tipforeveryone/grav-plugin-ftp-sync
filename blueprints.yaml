name: "[TIP] - FTP Sync"
version: 0.2.0
description: Sync user/pages and the active theme between local and hosting over FTP/FTPS, with conflict detection and automatic backup before overwriting.
icon: exchange
author:
  name: tipforeveryone
keywords: sync, ftp, deploy, pages, theme
license: MIT

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: admin }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin status
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    force_allow_remote:
      type: toggle
      label: Allow running even when not detected as local
      help: 'By default the plugin only allows "Sync now" when it detects it is running in a local environment (DDEV). Enable this to skip that check (NOT recommended).'
      default: 0
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    backup_enabled:
      type: toggle
      label: Auto-backup before overwriting
      highlight: 1
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    remote_base_path:
      type: text
      label: Root directory on hosting
      help: 'Absolute FTP path matching the site webroot, e.g. /public_html'
      default: '/'
      validate:
        required: true

    sync_plugins:
      type: checkboxes
      label: Plugins to sync
      help: 'Chọn các plugin (trong user/plugins/) muốn đồng bộ. Bỏ trống = đồng bộ TẤT CẢ plugin trong user/plugins/. (Theme được tự động lấy theo theme đang active của site — không khai báo ở đây, field này không áp dụng cho theme.)'
      data-options@: '\Grav\Plugin\FTPSyncPlugin::getPluginOptions'
      wrapper_classes: fts-plugins-grid
      use: keys

    ignore_patterns:
      type: text
      label: File/folder patterns to skip when syncing
      help: 'Comma-separated, supports the * wildcard. A pattern with NO slash (e.g. .git, *.zip) is matched against every path segment, at any depth — avoid generic words like "cache" here, many composer packages under vendor/ legitimately have a folder named exactly that (vendor/doctrine/cache, vendor/psr/cache, ...) and it would silently exclude them from Full deploy, breaking the site. A pattern WITH a slash (e.g. user/config/security.yaml) is matched against the full relative path instead, so it only excludes that exact file — use this form for sensitive files that share a basename with unrelated core files (system/config/security.yaml is a real Grav core file and must NOT be excluded). Sensitive files under user/config (security.yaml, security-private.php, versions.yaml) and this plugin''s own config file (ftp-sync.yaml) are blocked by default this way, to avoid leaking/overwriting the FTP password.'
      default: '.git,cache,.ddev,node_modules,*.zip,.DS_Store,Thumbs.db,user/config/security.yaml,user/config/security-private.php,user/config/versions.yaml,user/config/plugins/ftp-sync.yaml'
      validate:
        type: commalist

    ftp.host:
      type: text
      label: FTP Host
      validate:
        required: true

    ftp.port:
      type: text
      label: FTP Port
      default: 21
      validate:
        type: number
        required: true

    ftp.username:
      type: text
      label: FTP Username
      validate:
        required: true

    ftp.password:
      type: password
      label: FTP Password
      help: 'Stored in plaintext in the config — only use this on internal/trusted sites.'

    ftp.ssl:
      type: toggle
      label: Use FTPS (FTP over SSL)
      default: 0
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    ftp.passive:
      type: toggle
      label: Passive mode
      default: 1
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool
